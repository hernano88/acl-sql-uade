[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-controls-python-oracle"
version = "0.2.0"
description = "Synthetic financial control case studies with Pandas and Oracle SQL examples"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbclient>=0.10,<1", "ipykernel>=6,<8", "nbformat>=5.10,<6"]
oracle = ["SQLAlchemy>=2,<3", "oracledb>=2,<4"]
notebooks = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
