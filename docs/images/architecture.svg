<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title"><title id="title">End-to-end financial control architecture</title><rect width="1280" height="450" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="48" fill="#112a43" font-size="25" font-weight="700">FROM SOURCE DATA TO REVIEWABLE FINANCIAL CONTROLS</text><text x="36" y="80" fill="#52677d" font-size="17" font-weight="400">Offline fixtures are executable. Oracle is a safe optional extraction contract.</text><rect x="36" y="124" width="224" height="180" rx="12" fill="white" stroke="#d5e1ee"/><text x="54" y="157" fill="#087e87" font-size="16" font-weight="700">SOURCE</text><text x="54" y="197" fill="#112a43" font-size="15" font-weight="400">Synthetic CSV fixtures</text><text x="54" y="226" fill="#112a43" font-size="15" font-weight="400">Optional Oracle SQL</text><text x="54" y="255" fill="#112a43" font-size="15" font-weight="400">External configuration</text><path d="M262 215 H277" stroke="#087e87" stroke-width="3"/><path d="M271 209 L278 215 L271 221" fill="none" stroke="#087e87" stroke-width="3"/><rect x="282" y="124" width="224" height="180" rx="12" fill="white" stroke="#d5e1ee"/><text x="300" y="157" fill="#087e87" font-size="16" font-weight="700">CONTRACT</text><text x="300" y="197" fill="#112a43" font-size="15" font-weight="400">Period + source row ID</text><text x="300" y="226" fill="#112a43" font-size="15" font-weight="400">Student / program keys</text><text x="300" y="255" fill="#112a43" font-size="15" font-weight="400">Critical null checks</text><path d="M508 215 H523" stroke="#087e87" stroke-width="3"/><path d="M517 209 L524 215 L517 221" fill="none" stroke="#087e87" stroke-width="3"/><rect x="528" y="124" width="224" height="180" rx="12" fill="white" stroke="#d5e1ee"/><text x="546" y="157" fill="#087e87" font-size="16" font-weight="700">PANDAS</text><text x="546" y="197" fill="#112a43" font-size="15" font-weight="400">Normalize and scope</text><text x="546" y="226" fill="#112a43" font-size="15" font-weight="400">Counts + integer cents</text><text x="546" y="255" fill="#112a43" font-size="15" font-weight="400">Eligibility by program</text><path d="M754 215 H769" stroke="#087e87" stroke-width="3"/><path d="M763 209 L770 215 L763 221" fill="none" stroke="#087e87" stroke-width="3"/><rect x="774" y="124" width="224" height="180" rx="12" fill="white" stroke="#d5e1ee"/><text x="792" y="157" fill="#087e87" font-size="16" font-weight="700">CONTROL ENGINE</text><text x="792" y="197" fill="#112a43" font-size="15" font-weight="400">Validated outer joins</text><text x="792" y="226" fill="#112a43" font-size="15" font-weight="400">Bounded evidence</text><text x="792" y="255" fill="#112a43" font-size="15" font-weight="400">Original + residual</text><path d="M1000 215 H1015" stroke="#087e87" stroke-width="3"/><path d="M1009 209 L1016 215 L1009 221" fill="none" stroke="#087e87" stroke-width="3"/><rect x="1020" y="124" width="224" height="180" rx="12" fill="white" stroke="#d5e1ee"/><text x="1038" y="157" fill="#087e87" font-size="16" font-weight="700">REVIEW</text><text x="1038" y="197" fill="#112a43" font-size="15" font-weight="400">Independent totals bridge</text><text x="1038" y="226" fill="#112a43" font-size="15" font-weight="400">HTML / CSV / JSON</text><text x="1038" y="255" fill="#112a43" font-size="15" font-weight="400">Summary + stage ledger</text><rect x="36" y="336" width="1208" height="55" rx="12" fill="#e5f2f2" stroke="#d5e1ee"/><text x="56" y="370" fill="#087e87" font-size="18" font-weight="700">SCOPE  →  NORMALIZE  →  AGGREGATE  →  COMPARE  →  EXPLAIN  →  RECONCILE  →  REVIEW</text><text x="36" y="422" fill="#52677d" font-size="16" font-weight="400">No production connection, query, identifier, result or screenshot is included.</text></g></svg>
