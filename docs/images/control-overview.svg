<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title"><title id="title">Three synthetic financial control case studies</title><rect width="1280" height="480" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="45" fill="#112a43" font-size="27" font-weight="700">THREE CONTROLS. ONE SHARED PYTHON ENGINE.</text><text x="36" y="77" fill="#52677d" font-size="17" font-weight="400">Synthetic result overview · period 2030-09 · no production metrics</text><rect x="36" y="110" width="384" height="270" rx="12" fill="white" stroke="#d5e1ee"/><text x="58" y="148" fill="#087e87" font-size="20" font-weight="700">01  ENROLLMENT</text><text x="58" y="179" fill="#112a43" font-size="16" font-weight="400">Academic activity → assigned billing</text><text x="58" y="230" fill="#112a43" font-size="29" font-weight="700">10 → 9 lines</text><text x="58" y="264" fill="#52677d" font-size="14" font-weight="400">expected → actual</text><text x="58" y="308" fill="#112a43" font-size="19" font-weight="700">2 pending composite keys</text><text x="58" y="343" fill="#52677d" font-size="15" font-weight="400">Pending net 0; absolute 2 lines</text><rect x="448" y="110" width="384" height="270" rx="12" fill="white" stroke="#d5e1ee"/><text x="470" y="148" fill="#087e87" font-size="20" font-weight="700">02  BILLING</text><text x="470" y="179" fill="#112a43" font-size="16" font-weight="400">Assigned concepts → posted movements</text><text x="470" y="230" fill="#112a43" font-size="29" font-weight="700">930.00 → 890.00</text><text x="470" y="264" fill="#52677d" font-size="14" font-weight="400">expected → actual</text><text x="470" y="308" fill="#112a43" font-size="19" font-weight="700">2 pending composite keys</text><text x="470" y="343" fill="#52677d" font-size="15" font-weight="400">Pending shortages 230.00; net delta −40.00</text><rect x="860" y="110" width="384" height="270" rx="12" fill="white" stroke="#d5e1ee"/><text x="882" y="148" fill="#087e87" font-size="20" font-weight="700">03  SCHOLARSHIP</text><text x="882" y="179" fill="#112a43" font-size="16" font-weight="400">Theoretical benefit → applied benefit</text><text x="882" y="230" fill="#112a43" font-size="29" font-weight="700">45.00 → 65.00</text><text x="882" y="264" fill="#52677d" font-size="14" font-weight="400">expected → actual</text><text x="882" y="308" fill="#112a43" font-size="19" font-weight="700">2 pending composite keys</text><text x="882" y="343" fill="#52677d" font-size="15" font-weight="400">3.00 unassigned; full bridge reconciles</text><text x="36" y="420" fill="#112a43" font-size="20" font-weight="700">Original difference + evidence allocation + pending residual + independent totals</text><text x="36" y="452" fill="#52677d" font-size="17" font-weight="400">Executed notebooks • strict keys • validated joins • integer cents • HTML / CSV review</text></g></svg>
