name: Synthetic financial controls

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline demo and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: Generate review reports
        run: python -m financial_controls.demo --period 2030-09 --output artifacts
      - name: Execute three notebooks in fresh kernels
        run: python scripts/run_notebooks.py
      - name: Generate synthetic portfolio evidence
        run: python scripts/build_portfolio_assets.py
      - name: Check documentation and notebook links
        run: python scripts/check_links.py
      - name: Scan public source text
        run: python scripts/scan_public.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-review-python-${{ matrix.python }}
          path: artifacts/
