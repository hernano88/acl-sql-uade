name: Python reconciliation tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_jupyter/requirements.txt
      - name: Install test dependencies
        run: python -m pip install "pandas>=2.2,<3.0" "pytest>=8.0,<9.0"
      - name: Validate reconciliation logic
        run: python -m pytest -q
